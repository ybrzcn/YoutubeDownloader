server {
    listen 80;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript
               text/javascript text/css application/json application/wasm
               font/woff2;

    # API proxy — /api/ isteklerini backend container'a yönlendir
    location /api/ {
        proxy_pass         http://api:5232/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Büyük video indirmeleri için uzun timeout
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    # Blazor WASM — SPA fallback (tüm rotalar index.html'e döner)
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}
