server {
    listen 80;
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript
               text/javascript text/css application/json application/wasm
               font/woff2;

    # API info proxy
    location /api/video/info {
        proxy_pass         http://192.168.1.210:5232/api/video/info;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        proxy_buffering     off;
    }

    # API log proxy
    location /api/log {
        proxy_pass         http://192.168.1.210:5232/api/log;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Download - uzun timeout
    location /api/video/download {
        proxy_pass         http://192.168.1.210:5232/api/video/download;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    # SPA fallback
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}